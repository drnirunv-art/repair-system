<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบ FM และวิศวกรรมอาคาร</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  .brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:36px auto 18px}
  .brand .logo{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:18px}
  .brand h1{margin:6px 0 0;font-size:22px}.brand p{margin:0;color:var(--muted)}
  .box{max-width:400px;margin:0 auto 40px}
  .links{display:flex;justify-content:center;gap:18px;margin-top:6px}
  .links button{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer;padding:6px}
  .cards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .cards a{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none;font-weight:600;font-size:16px}
  .cards a:hover{border-color:var(--accent)}
  .cards a i{font-style:normal;font-size:24px;width:30px;text-align:center}
  .cards a small{display:block;font-weight:400;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="brand"><div class="logo">FM</div><h1>ระบบ FM และวิศวกรรมอาคาร</h1><p id="sub">Facility Management &amp; Building Engineering</p></div>
<main class="wrap">
  <section id="login" class="box" hidden>
    <form id="fLogin" class="panel">
      <h2 style="margin-top:0">เข้าสู่ระบบ</h2>
      <div style="display:flex;flex-direction:column;gap:12px">
        <label>อีเมล<input id="lEmail" type="email" required autocomplete="username"></label>
        <label>รหัสผ่าน<input id="lPass" type="password" required minlength="8" autocomplete="current-password"></label>
        <button class="btn primary" style="justify-content:center">เข้าสู่ระบบ</button>
      </div>
      <div class="links"><button type="button" id="lForgot">ลืมรหัสผ่าน</button><button type="button" id="lSignup">สมัครบัญชีครั้งแรก</button></div>
      <div id="lMsg"></div>
    </form>
  </section>
  <section id="home" class="box" hidden>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">หน้าหลักของฉัน</h2><button class="btn small" id="out" type="button">ออกจากระบบ</button></div>
      <p class="sub" id="hello" style="margin:6px 0 0"></p>
      <label id="hospL" hidden style="margin-top:10px">โรงพยาบาลที่กำลังทำงาน<select id="hosp"></select></label>
      <div class="cards" id="cards"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
  const { sb, esc, errText } = RS, $ = s => document.querySelector(s);
  const ICON = { "staff.html": ["🧰", "ใบงานแจ้งซ่อม", "รับงาน มอบหมาย อะไหล่ ขอซื้อ รายงาน ตั้งค่า"], "fms.html": ["🔎", "FMS Round · ตรวจ JCI", "เอกสาร เดินตรวจ Tracer"],
    "gate.html": ["🛂", "ป้อม รปภ.", "ผู้รับเหมาเข้า-ออก"], "pmboard.html": ["📊", "PM Board", "ความพร้อมอาคาร"], "pm.html": ["🛠️", "PM Inhouse / PM MA", "แผนบำรุงรักษา"],
    "ma.html": ["📑", "สัญญา MA 12 โรง", ""], "op.html": ["🌡️", "บันทึก OP", "ค่าตรวจประจำวัน"], "book.html": ["📘", "Monthly Report", ""], "market.html": ["🔁", "ตลาดอะไหล่", "แลกอะไหล่ 12 โรง"],
    "ref.html": ["☎️", "เบอร์ภายใน · ข้อมูลพื้นที่", ""], "ac.html": ["❄️", "งานผู้รับเหมาแอร์", ""], "survey.html": ["📝", "แบบสอบถาม", ""], "wp.html": ["🦺", "Work Permit", "ใบอนุญาตทำงาน"],
    "ops.html": ["🗓️", "ส่งเวร · รายงานเดือน", "คลังวิธีแก้"], "kpi.html": ["🎯", "KPI ตามสัญญา", "แนบ 4 รายเดือน 12 โรง"], "training.html": ["🎓", "อบรม · แฟ้มสมรรถนะ", "ช่าง แม่บ้าน รปภ. · JCI · KPI ข้อ 7"], "energy.html": ["⚡", "รายงานพลังงาน (GHI)", "ไฟ น้ำ Chiller CO₂e · KPI 8.1"], "perf.html": ["📊", "ประชุม Bi-Weekly Performance", "รายงาน Chief · Backlog · Action plan AI"], "opd.html": ["🧭", "Operation Dashboard (รวม)", "แดชบอร์ดเดิม 12 โรง + ทุกหน้าของระบบ"], "water.html": ["💧", "Water Management", "Cooling tower · RO ไตเทียม / CSSD · น้ำประปา · JCI FMS.08.04"] };
  const msg = (h, ok) => $("#lMsg").innerHTML = `<div class="note ${ok ? "ok" : "bad"}">${h}</div>`;
  $("#fLogin").onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lPass").value });
    if (error) msg(esc(error.message === "Invalid login credentials" ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง" : errText(error))); };
  $("#lSignup").onclick = async () => { if (!$("#fLogin").reportValidity()) return;
    const { error } = await sb.auth.signUp({ email: $("#lEmail").value.trim(), password: $("#lPass").value });
    msg(error ? esc(errText(error)) : "สมัครแล้ว ถ้ามีอีเมลยืนยัน ให้กดลิงก์ในอีเมลก่อน แล้วกลับมาเข้าสู่ระบบ", !error); };
  $("#lForgot").onclick = async () => { const em = $("#lEmail").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return msg("พิมพ์อีเมลในช่อง อีเมล ก่อน แล้วกด ลืมรหัสผ่าน อีกครั้ง");
    const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.replace(/home\.html.*$/, "staff.html") });
    msg(error ? esc(/rate limit/i.test(error.message || "") ? "ส่งอีเมลได้จำนวนจำกัดต่อชั่วโมง รอประมาณ 1 ชั่วโมงแล้วลองใหม่" : errText(error)) : `ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ ${esc(em)} แล้ว เปิดอีเมลแล้วกดลิงก์`, !error); };
  $("#out").onclick = async () => { await sb.auth.signOut(); location.replace("home.html"); };
  let drawn = false;
  const boot = async session => {
    $("#login").hidden = !!session; $("#home").hidden = true;
    if (!session || drawn) return; drawn = true;
    const [{ data: me }, { data: acc }] = await Promise.all([sb.from("profiles").select("full_name,hospital_id,hospitals(name)").eq("id", session.user.id).maybeSingle(), sb.rpc("my_access")]);
    const pages = acc && Array.isArray(acc.pages) ? acc.pages : RS_PAGES.map(x => x[0]);
    $("#hello").textContent = `สวัสดีครับ ${(me && me.full_name) || session.user.email}${me && me.hospitals ? " · " + me.hospitals.name : ""}`;
    sb.rpc("my_central").then(r => { if (r && r.data === true) $("#hello").textContent += " (สังกัดส่วนกลาง)"; }, () => {});
    const list = me && me.hospital_id ? RS_PAGES.map(x => x[0]).filter(p => pages.includes(p)) : [];
    $("#cards").innerHTML = list.map(p => { const [i, t, s] = ICON[p] || ["▫️", p, ""]; return `<a href="${p}"><i>${i}</i><span>${esc(t)}${s ? `<small>${esc(s)}</small>` : ""}</span></a>`; }).join("")
      || `<p class="sub">บัญชีนี้ยังไม่ได้เปิดใช้งาน ให้แจ้งหัวหน้าเพิ่มอีเมลนี้ในระบบ</p>`;
    // more than one hospital given: pick the one being worked in now
    const mh = (await sb.rpc("my_hospitals")).data || [];
    if (mh.length > 1) { $("#hosp").innerHTML = mh.map(h => `<option value="${h.id}" ${h.current ? "selected" : ""}>${esc(h.code)} · ${esc(h.name)}</option>`).join(""); $("#hospL").hidden = false;
      $("#hosp").onchange = async () => { const r = await sb.rpc("switch_hospital", { p_hospital: $("#hosp").value }); if (r.error) return msg(esc(errText(r.error))); location.reload(); }; }
    $("#home").hidden = false;
    // came from a link that needs signing in first (e.g. the sign-up approval e-mail): continue there
    const next = new URLSearchParams(location.search).get("next");
    if (next && /^[a-z]+\.html(\?[^#]*)?$/.test(next) && list.includes(next.split("?")[0])) location.replace(next);
  };
  sb.auth.getSession().then(r => boot(r.data && r.data.session));
  sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") { drawn = false; boot(s); } });
})();
</script>
</body>
</html>
