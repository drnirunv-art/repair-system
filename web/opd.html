<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Operation Dashboard รวม | Repair System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  .hub{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
  .menu{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
  .menu h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .menu .grp{margin:0;font-size:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
  .menu button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:8px 10px;border-radius:6px;font-weight:500}
  .menu button small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .menu button:hover{background:var(--accent-soft)}
  .menu button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
  .menu button[aria-current=true] small{color:inherit;opacity:.85}
  .menu button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .view{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
  .vbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .vbar b{font-size:15px}
  .vbar a{margin-left:auto;color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
  iframe{border:0;width:100%;flex:1;min-height:calc(100vh - 170px);background:#fff}
  .ext{padding:28px;text-align:center}
  .ext p{color:var(--muted)}
  .ext a.big{display:inline-block;margin-top:8px;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:8px;font-weight:600;text-decoration:none}
  .hsel{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  .hsel select{width:auto}
  @media (max-width:820px){.hub{grid-template-columns:1fr}.menu{position:static}iframe{min-height:75vh}.view{min-height:0}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><span class="tag">OPD</span><h1>Operation Dashboard (รวม)</h1>
    <div class="who"><label class="hsel">โรงพยาบาลสำหรับระบบแจ้งซ่อม
      <select id="hosp">
        <option value="PT1">PT1 พญาไท 1</option><option value="PT2">PT2 พญาไท 2</option><option value="PT3">PT3 พญาไท 3</option>
        <option value="PTN">PTN พญาไท นวมินทร์</option><option value="PTW">PTW พญาไท บ่อวิน</option><option value="PTS">PTS พญาไท ศรีราชา</option>
        <option value="PTP">PTP พญาไท พหลโยธิน</option><option value="PLD">PLD เปาโล พระประแดง</option><option value="PLR">PLR เปาโล รังสิต</option>
        <option value="PLS">PLS เปาโล สมุทรปราการ</option><option value="PLK">PLK เปาโล เกษตร</option><option value="PLC">PLC เปาโล โชคชัย 4</option>
      </select></label></div></div>
</div></header>
<main class="wrap">
  <div class="hub">
    <nav class="menu" id="menu" aria-label="เมนู Operation Dashboard"></nav>
    <section class="view">
      <div class="vbar"><b id="vTitle"></b><a id="vOpen" target="_blank" rel="noopener">เปิดหน้าต่างใหม่ ↗</a></div>
      <div id="vBody" style="display:flex;flex:1"></div>
    </section>
  </div>
</main>
<script>
// Links only: this page shows the existing dashboards as they are (read-only) and never changes them.
const GH = "https://drnirunv-art.github.io";
const MENU = [
  { group: "Operation Dashboard (เดิม)", items: [
    { id: "overview", t: "ภาพรวม 12 รพ. รายวัน", s: "Overview · view=day", url: () => GH + "/op-dashboard/overview.html?view=day" },
    { id: "cl-pt1", t: "คลอรีน PT1", s: "Chlorine · พญาไท 1", url: () => GH + "/op-dashboard/chlorine/?h=pt1" },
    { id: "cl-pt2", t: "คลอรีน PT2", s: "Chlorine · พญาไท 2", url: () => GH + "/op-dashboard/chlorine/?h=pt2" },
    { id: "pt2", t: "PT2 Dashboard", s: "แดชบอร์ด พญาไท 2", url: () => GH + "/pt2-dashboard/?p=pt2" },
    { id: "sheet", t: "Google Sheet ข้อมูล OP", s: "เปิดในแท็บใหม่", ext: true,
      url: () => "https://docs.google.com/spreadsheets/d/1QleW21IDFVdVI8XuTUnuujx5g2pQiqQbQFsTJDzb07I/edit?gid=965691497#gid=965691497" }
  ]},
  { group: "ระบบแจ้งซ่อม RS", items: [
    { id: "staff", t: "ใบงาน / Dashboard งานซ่อม", s: "เจ้าหน้าที่ (ต้องเข้าสู่ระบบ)", url: h => "staff.html?h=" + h },
    { id: "report", t: "แจ้งซ่อม", s: "ฟอร์มผู้แจ้ง", url: h => "index.html?h=" + h },
    { id: "pm", t: "PM Inhouse", s: "แผน PM · ทะเบียนเครื่อง · QR", url: h => "pm.html?h=" + h },
    { id: "op", t: "บันทึก OP", s: "Log รายวัน", url: h => "op.html?h=" + h },
    { id: "ops", t: "ส่งเวร · รายงานเดือน", s: "คลังวิธีแก้", url: h => "ops.html?h=" + h },
    { id: "book", t: "Monthly Report", s: "R1–R10", url: h => "book.html?h=" + h },
    { id: "market", t: "ตลาดอะไหล่", s: "อะไหล่ 12 รพ.", url: h => "market.html?h=" + h },
    { id: "ac", t: "งานผู้รับเหมาแอร์", s: "ตรวจรับตาม TOR", url: h => "ac.html?h=" + h },
    { id: "wp", t: "Work Permit", s: "ใบอนุญาตทำงาน", url: h => "wp.html?h=" + h },
    { id: "survey", t: "แบบสอบถาม", s: "สรุปความพึงพอใจ", url: h => "survey.html?view=1&h=" + h }
  ]}
];
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const hospSel = $("#hosp");
const params = new URLSearchParams(location.search);
hospSel.value = (params.get("h") || store.get("opd.h") || "PT1").toUpperCase();
if (!hospSel.value) hospSel.value = "PT1";
const all = MENU.flatMap(g => g.items);
let current = all.find(i => i.id === (params.get("v") || store.get("opd.v"))) || all[0];

$("#menu").innerHTML = MENU.map(g => `<div class="grp"><h3>${g.group}</h3>${g.items.map(i =>
  `<button type="button" data-id="${i.id}">${i.t}${i.ext ? " ↗" : ""}<small>${i.s}</small></button>`).join("")}</div>`).join("");

function show(item) {
  current = item;
  const url = item.url(hospSel.value);
  document.querySelectorAll("#menu button").forEach(b => b.setAttribute("aria-current", b.dataset.id === item.id));
  $("#vTitle").textContent = item.t;
  $("#vOpen").href = url;
  $("#vBody").innerHTML = item.ext
    ? `<div class="ext" style="flex:1"><h2>${item.t}</h2><p>Google Sheet เปิดได้เฉพาะในแท็บใหม่ (Google ไม่ให้ฝังในหน้าอื่น)</p><a class="big" href="${url}" target="_blank" rel="noopener">เปิด Google Sheet ↗</a></div>`
    : `<iframe src="${url}" title="${item.t}" loading="lazy"></iframe>`;
  store.set("opd.v", item.id);
  const p = new URLSearchParams({ v: item.id, h: hospSel.value });
  history.replaceState(null, "", "?" + p);
}
$("#menu").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; show(all.find(i => i.id === b.dataset.id)); if (matchMedia("(max-width:820px)").matches) document.querySelector(".view").scrollIntoView({ behavior: "smooth" }); });
hospSel.addEventListener("change", () => { store.set("opd.h", hospSel.value); show(current); });
show(current);
</script>
</body>
</html>
