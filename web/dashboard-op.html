<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Operation 12 รพ. | Repair System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bar select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);max-width:100%}
  .frame{width:100%;height:calc(100vh - 230px);min-height:520px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .h{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
  .h.mine{border-color:var(--accent);background:var(--accent-soft)}
  .h b{font-size:15px}.h small{color:var(--muted)}
  .h .acts{display:flex;gap:6px;flex-wrap:wrap}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><span class="tag">OP</span><h1>Dashboard Operation 12 โรงพยาบาล</h1>
    <div class="who"><a class="btn small" id="back" href="staff.html">← กลับหน้าใบงาน</a></div></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="overview" aria-selected="true">ภาพรวม 12 โรง</button>
    <button role="tab" data-tab="hosp" aria-selected="false">รายโรงพยาบาล</button>
    <button role="tab" data-tab="links" aria-selected="false">ลิงก์ทั้งหมด</button>
  </nav>
</div></header>
<main class="wrap">
  <section id="tab-overview">
    <div class="bar">
      <button class="btn small primary" data-view="day">รายวัน</button>
      <button class="btn small" data-view="month">รายเดือน</button>
      <a class="btn small" id="ovOpen" target="_blank" rel="noopener">เปิดเต็มจอ ↗</a>
    </div>
    <iframe class="frame" id="ovFrame" title="แดชบอร์ดรวม 12 โรง" loading="lazy"></iframe>
  </section>

  <section id="tab-hosp" hidden>
    <div class="bar">
      <select id="hSel" aria-label="เลือกโรงพยาบาล"></select>
      <button class="btn small primary" data-page="dash">แดชบอร์ด</button>
      <button class="btn small" data-page="form">ช่างกรอกค่า</button>
      <a class="btn small" id="hOpen" target="_blank" rel="noopener">เปิดเต็มจอ ↗</a>
    </div>
    <iframe class="frame" id="hFrame" title="แดชบอร์ดรายโรง" loading="lazy"></iframe>
  </section>

  <section id="tab-links" hidden>
    <div class="grid" id="grid"></div>
    <p class="note">หน้านี้เปิดระบบ Dashboard Operation เดิมให้ดูจากเมนูของเรา ข้อมูลและการบันทึกยังอยู่ในระบบเดิมทั้งหมด ไม่มีการแก้ไขระบบเดิม
      ลิงก์ “ช่างกรอกค่า” ให้ส่งเฉพาะช่างของโรงนั้น</p>
  </section>
</main>
<script>
(() => {
  const BASE = "https://drnirunv-art.github.io/pt2-dashboard/";
  const OVERVIEW = "https://drnirunv-art.github.io/op-dashboard/overview.html";
  // same order as the daily summary email
  const H = [
    ["pt2","โรงพยาบาลพญาไท 2",158],["plc","โรงพยาบาลเปาโล โชคชัย 4",69],["pld","โรงพยาบาลเปาโล พระประแดง",57],
    ["plk","โรงพยาบาลเปาโล เกษตร",56],["plr","โรงพยาบาลเปาโล รังสิต",73],["pls","โรงพยาบาลเปาโล สมุทรปราการ",78],
    ["pt1","โรงพยาบาลพญาไท 1",150],["pt3","โรงพยาบาลพญาไท 3",166],["ptn","โรงพยาบาลพญาไท นวมินทร์",91],
    ["ptp","โรงพยาบาลพญาไท พหลโยธิน",139],["pts","โรงพยาบาลพญาไท ศรีราชา",180],["ptw","โรงพยาบาลพญาไท บ่อวิน",122]];
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const qs = new URLSearchParams(location.search);
  const mine = (qs.get("h") || "").toLowerCase();
  if (mine) $("#back").href = "staff.html?h=" + encodeURIComponent(qs.get("h"));
  const dashUrl = c => BASE + "?p=" + c, formUrl = c => BASE + "?p=" + c + "&page=form";

  function setActive(btns, b){ btns.forEach(x => x.classList.toggle("primary", x === b)); }

  // overview
  const ovBtns = $$("[data-view]");
  function ov(view){ const u = OVERVIEW + "?view=" + view; $("#ovFrame").src = u; $("#ovOpen").href = u; setActive(ovBtns, ovBtns.find(b => b.dataset.view === view)); }
  ovBtns.forEach(b => b.onclick = () => ov(b.dataset.view));

  // per hospital
  const sel = $("#hSel"); let page = "dash";
  sel.innerHTML = H.map(([c,n]) => `<option value="${c}">${n}</option>`).join("");
  if (H.some(h => h[0] === mine)) sel.value = mine;
  const pgBtns = $$("[data-page]");
  function hs(){ const u = page === "form" ? formUrl(sel.value) : dashUrl(sel.value); $("#hFrame").src = u; $("#hOpen").href = u; setActive(pgBtns, pgBtns.find(b => b.dataset.page === page)); }
  sel.onchange = hs; pgBtns.forEach(b => b.onclick = () => { page = b.dataset.page; hs(); });

  // all links
  $("#grid").innerHTML = H.map(([c,n,k]) => `<div class="h${c===mine?" mine":""}"><b>${n}</b><small>รหัส ${c.toUpperCase()} · ${k} รายการตรวจ${c===mine?" · โรงของคุณ":""}</small>
    <div class="acts"><a class="btn small primary" target="_blank" rel="noopener" href="${dashUrl(c)}">แดชบอร์ด ↗</a><a class="btn small" target="_blank" rel="noopener" href="${formUrl(c)}">ช่างกรอกค่า ↗</a></div></div>`).join("");

  // tabs (lazy-load iframes on first open)
  let loaded = {};
  function tab(t){
    $$("[role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    ["overview","hosp","links"].forEach(x => $("#tab-" + x).hidden = x !== t);
    if (!loaded[t]) { loaded[t] = 1; if (t === "overview") ov(qs.get("view") === "month" ? "month" : "day"); if (t === "hosp") hs(); }
  }
  $$("[role=tab]").forEach(b => b.onclick = () => tab(b.dataset.tab));
  tab(mine && H.some(h => h[0] === mine) ? "hosp" : "overview");
})();
</script>
</body>
</html>
